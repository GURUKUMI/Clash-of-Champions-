<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADAPTO-X — Game Edukasi Les</title>
  
  <!-- Font Cinematic & Futuristic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-dark: #070c14;
      --panel-bg: rgba(14, 25, 44, 0.85);
      --panel-border: rgba(0, 210, 255, 0.3);
      --cyan-glow: #00d2ff;
      --cyan-bright: #64f3ff;
      --accent-gold: #ffc83b;
      --metal-grad-start: #e2e8f0;
      --metal-grad-end: #94a3b8;
      --text-glow: 0 0 10px rgba(0, 210, 255, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(0, 210, 255, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 50% 80%, rgba(15, 23, 42, 0.8) 0%, transparent 70%),
        linear-gradient(to bottom, #040810, #0a1322);
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(6, 11, 21, 0.95);
      border: 1px solid var(--panel-border);
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.2), inset 0 0 15px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 16px;
      position: absolute;
      top: 0;
      left: 0;
      overflow-y: auto;
    }

    .screen.active {
      display: flex;
    }

    /* TYPOGRAPHY METALLIC & GLOW */
    .title-clash {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: 2rem;
      text-align: center;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 40%, #64748b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
      margin-bottom: 2px;
    }

    .badge-adapto {
      align-self: center;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 1px solid var(--cyan-glow);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
      padding: 4px 16px;
      border-radius: 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #fff;
    }

    /* HOME SCREEN */
    #screen-home {
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      background: radial-gradient(circle at center, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
    }

    .hero-logo {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .hero-logo h1 {
      font-size: 2.5rem;
      line-height: 1.1;
    }

    .roster-preview {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
      backdrop-filter: blur(8px);
    }

    .roster-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: var(--cyan-bright);
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .roster-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .roster-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 3px solid var(--cyan-glow);
      padding: 8px 10px;
      border-radius: 4px;
      text-align: left;
    }

    .roster-name {
      font-weight: 700;
      font-size: 1rem;
      color: #f1f5f9;
    }

    .roster-class {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .btn-start {
      width: 100%;
      padding: 16px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: #030712;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      border: 2px solid var(--cyan-bright);
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-start:active {
      transform: scale(0.98);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    /* GAME HEADER */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .round-indicator {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--cyan-bright);
    }

    .scoreboard-mini {
      display: flex;
      gap: 12px;
    }

    .score-tag {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .score-tag .name {
      font-size: 0.7rem;
      color: #94a3b8;
    }

    .score-tag .pts {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #f8fafc;
    }

    /* SOAL BOARD */
    .questions-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .question-card {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      position: relative;
      transition: all 0.3s ease;
    }

    .question-card.answered {
      opacity: 0.6;
      border-color: rgba(255, 255, 255, 0.05);
      background: rgba(10, 16, 26, 0.6);
    }

    .question-card.active-target {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .q-student {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--cyan-bright);
    }

    .q-status {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }

    .q-status.done {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    .q-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.3;
    }

    /* ACTION & KEYPAD AREA */
    .action-panel {
      margin-top: auto;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-trigger-input {
      width: 100%;
      padding: 12px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #ffffff;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid var(--cyan-glow);
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
      cursor: pointer;
    }

    .btn-next-round {
      width: 100%;
      padding: 12px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #030712;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      border: 1px solid var(--accent-gold);
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
      cursor: pointer;
    }

    /* MODAL KEYPAD */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(6px);
      z-index: 50;
      flex-direction: column;
      justify-content: flex-end;
    }

    .modal-overlay.active {
      display: flex;
    }

    .keypad-frame {
      background: linear-gradient(180deg, #0f172a 0%, #090d16 100%);
      border-top: 2px solid var(--cyan-glow);
      border-radius: 16px 16px 0 0;
      padding: 16px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8);
    }

    .select-student-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .select-label {
      font-size: 0.8rem;
      color: #94a3b8;
      font-family: 'Orbitron', sans-serif;
    }

    .student-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .btn-student-choice {
      padding: 8px 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-student-choice.selected {
      background: var(--cyan-glow);
      color: #030712;
      border-color: #fff;
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    .btn-student-choice.disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .display-box {
      background: #020617;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .display-label {
      font-size: 0.85rem;
      color: #64748b;
    }

    .display-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--cyan-bright);
      letter-spacing: 2px;
    }

    /* KEYPAD BUTTONS ADAPTOX STYLE */
    .numpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn-num {
      background: linear-gradient(180deg, var(--metal-grad-start) 0%, var(--metal-grad-end) 100%);
      color: #0f172a;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      padding: 12px 0;
      border: 1px solid #ffffff;
      border-radius: 6px;
      box-shadow: 0 4px 0 #475569, inset 0 2px 2px rgba(255, 255, 255, 0.8);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-num:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #475569;
    }

    .btn-num.action {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      border-color: var(--cyan-bright);
      box-shadow: 0 4px 0 #0369a1;
    }

    .btn-num.action:active {
      box-shadow: 0 2px 0 #0369a1;
    }

    .btn-close-modal {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* LEADERBOARD SCREEN */
    #screen-leaderboard {
      text-align: center;
      justify-content: space-between;
      padding: 30px 16px;
    }

    .podium-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
    }

    .podium-card {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .podium-card.rank-1 {
      border-color: var(--accent-gold);
      box-shadow: 0 0 15px rgba(255, 200, 59, 0.3);
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.15) 0%, var(--panel-bg) 100%);
    }

    .rank-num {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.2rem;
      width: 30px;
    }

    .rank-1 .rank-num { color: var(--accent-gold); }
    .rank-2 .rank-num { color: #cbd5e1; }
    .rank-3 .rank-num { color: #b45309; }

    .player-info {
      text-align: left;
      flex-grow: 1;
      margin-left: 12px;
    }

    .player-name {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .player-class {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .player-score {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--cyan-bright);
    }

    /* NOTIFICATION FEEDBACK */
    .feedback-toast {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      padding: 16px 24px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      text-align: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .feedback-toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .feedback-toast.correct {
      background: rgba(34, 197, 94, 0.95);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
    }

    .feedback-toast.wrong {
      background: rgba(239, 68, 68, 0.95);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- TOAST FEEDBACK -->
    <div id="toast" class="feedback-toast">BENAR! +100</div>

    <!-- 1. HOME SCREEN -->
    <div id="screen-home" class="screen active">
      <div class="hero-logo">
        <div class="badge-adapto">ADAPTO-X</div>
        <h1 class="title-clash">CLASH OF<br>CHAMPIONS</h1>
      </div>

      <div class="roster-preview">
        <div class="roster-title">PESERTA LES</div>
        <div class="roster-grid">
          <div class="roster-item">
            <div class="roster-name">EZAR</div>
            <div class="roster-class">Kelas 2 SD</div>
          </div>
          <div class="roster-item">
            <div class="roster-name">AZRIL</div>
            <div class="roster-class">Kelas 4 SD</div>
          </div>
          <div class="roster-item">
            <div class="roster-name">AZKA</div>
            <div class="roster-class">Kelas 4 SD</div>
          </div>
          <div class="roster-item">
            <div class="roster-name">ALULA</div>
            <div class="roster-class">Kelas 5 SD</div>
          </div>
        </div>
      </div>

      <button class="btn-start" onclick="startGame()">MULAI PERMAINAN</button>
    </div>

    <!-- 2. GAMEPLAY SCREEN -->
    <div id="screen-game" class="screen">
      <div class="game-header">
        <div class="round-indicator" id="round-title">RONDE 1 / 4</div>
        <div class="scoreboard-mini" id="scoreboard-mini">
          <!-- Mini score rendered via JS -->
        </div>
      </div>

      <div class="questions-container" id="questions-list">
        <!-- Soal 4 anak rendered via JS -->
      </div>

      <div class="action-panel">
        <button id="btn-input-ans" class="btn-trigger-input" onclick="openKeypad()">INPUT JAWABAN</button>
        <button id="btn-next-rnd" class="btn-next-round" style="display: none;" onclick="nextRound()">LANJUT KE RONDE NEXT</button>
      </div>
    </div>

    <!-- 3. LEADERBOARD SCREEN -->
    <div id="screen-leaderboard" class="screen">
      <div>
        <div class="badge-adapto" style="margin-top: 10px;">ADAPTO-X</div>
        <h1 class="title-clash" style="font-size: 1.8rem; margin-top: 10px;">HASIL AKHIR</h1>
      </div>

      <div class="podium-container" id="podium-list">
        <!-- Podium list rendered via JS -->
      </div>

      <button class="btn-start" onclick="resetGame()">MAIN LAGI</button>
    </div>

    <!-- MODAL KEYPAD NUMPAD -->
    <div id="keypad-modal" class="modal-overlay">
      <div class="keypad-frame">
        <div class="select-student-group">
          <div class="select-label">PILIH NAMA PENJAWAB:</div>
          <div class="student-buttons" id="student-selector">
            <!-- Buttons dynamically generated -->
          </div>
        </div>

        <div class="display-box">
          <span class="display-label">JAWABAN:</span>
          <span class="display-val" id="input-display">_</span>
        </div>

        <div class="numpad-grid">
          <button class="btn-num" onclick="pressNum('1')">1</button>
          <button class="btn-num" onclick="pressNum('2')">2</button>
          <button class="btn-num" onclick="pressNum('3')">3</button>
          <button class="btn-num" onclick="pressNum('4')">4</button>
          <button class="btn-num" onclick="pressNum('5')">5</button>
          <button class="btn-num" onclick="pressNum('6')">6</button>
          <button class="btn-num" onclick="pressNum('7')">7</button>
          <button class="btn-num" onclick="pressNum('8')">8</button>
          <button class="btn-num" onclick="pressNum('9')">9</button>
          <button class="btn-num action" onclick="pressDel()">⌫</button>
          <button class="btn-num" onclick="pressNum('0')">0</button>
          <button class="btn-num action" onclick="submitAnswer()">➔</button>
        </div>

        <button class="btn-close-modal" onclick="closeKeypad()">Batal / Tutup</button>
      </div>
    </div>

  </div>

  <script>
    /* ===================================================
       BANK SOAL REVISI TERAKHIR (EZAR, AZRIL, AZKA, ALULA)
       =================================================== */
    const studentsData = [
      { id: 'ezar', name: 'EZAR', class: 'Kelas 2' },
      { id: 'azril', name: 'AZRIL', class: 'Kelas 4' },
      { id: 'azka', name: 'AZKA', class: 'Kelas 4' },
      { id: 'alula', name: 'ALULA', class: 'Kelas 5' }
    ];

    const questionsBank = {
      1: {
        ezar: { q: "25 + 17 = ...", a: 42 },
        azril: { q: "12 × 8 = ...", a: 96 },
        azka: { q: "15 × 6 = ...", a: 90 },
        alula: { q: "252 ÷ 6 = ...", a: 42 }
      },
      2: {
        ezar: { q: "50 - 18 = ...", a: 32 },
        azril: { q: "1.250 + 1.350 = ...", a: 2600 },
        azka: { q: "2.400 + 1.800 = ...", a: 4200 },
        alula: { q: "35.000 - 18.500 = ...", a: 16500 }
      },
      3: {
        ezar: { q: "2 × 8 = ...", a: 16 },
        azril: { q: "25 × 14 = ...", a: 350 },
        azka: { q: "18 × 15 = ...", a: 270 },
        alula: { q: "125 × 16 = ...", a: 2000 }
      },
      4: {
        ezar: { q: "Budi punya 15 kelereng, lalu diberi ayah 12 kelereng lagi. Berapa total kelereng Budi?", a: 27 },
        azril: { q: "Sebuah toko memiliki 15 kotak pensil. Setiap kotak berisi 12 pensil. Berapa jumlah seluruh pensil?", a: 180 },
        azka: { q: "Ada 12 truk. Setiap truk mengangkut 20 karung beras. Berapa total karung beras yang diangkut?", a: 240 },
        alula: { q: "Sebuah kue dipotong menjadi 48 bagian dan dibagikan sama rata kepada 6 anak. Berapa potong kue yang diterima setiap anak?", a: 8 }
      }
    };

    /* STATE GAME */
    let currentRound = 1;
    let scores = { ezar: 0, azril: 0, azka: 0, alula: 0 };
    let answeredThisRound = { ezar: false, azril: false, azka: false, alula: false };
    let selectedStudentId = null;
    let currentInputValue = "";

    /* AUDIO SYNTHESIZER */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq, type = 'sine', duration = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playSoundCorrect() {
      playBeep(523.25, 'triangle', 0.1);
      setTimeout(() => playBeep(659.25, 'triangle', 0.15), 100);
      setTimeout(() => playBeep(783.99, 'triangle', 0.25), 200);
    }

    function playSoundWrong() {
      playBeep(220, 'sawtooth', 0.15);
      setTimeout(() => playBeep(180, 'sawtooth', 0.25), 150);
    }

    /* NAVIGATION */
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startGame() {
      currentRound = 1;
      scores = { ezar: 0, azril: 0, azka: 0, alula: 0 };
      initRound();
      showScreen('screen-game');
    }

    function initRound() {
      answeredThisRound = { ezar: false, azril: false, azka: false, alula: false };
      document.getElementById('round-title').innerText = `RONDE ${currentRound} / 4`;
      
      document.getElementById('btn-input-ans').style.display = 'block';
      document.getElementById('btn-next-rnd').style.display = 'none';

      renderMiniScoreboard();
      renderQuestions();
    }

    function renderMiniScoreboard() {
      const sb = document.getElementById('scoreboard-mini');
      sb.innerHTML = '';
      studentsData.forEach(s => {
        sb.innerHTML += `
          <div class="score-tag">
            <span class="name">${s.name}</span>
            <span class="pts">${scores[s.id]}</span>
          </div>
        `;
      });
    }

    function renderQuestions() {
      const qContainer = document.getElementById('questions-list');
      qContainer.innerHTML = '';

      studentsData.forEach(s => {
        const isDone = answeredThisRound[s.id];
        const qData = questionsBank[currentRound][s.id];

        qContainer.innerHTML += `
          <div class="question-card ${isDone ? 'answered' : ''}">
            <div class="q-header">
              <span class="q-student">${s.name} (${s.class})</span>
              <span class="q-status ${isDone ? 'done' : ''}">${isDone ? 'SELESAI' : 'BELUM'}</span>
            </div>
            <div class="q-text">${qData.q}</div>
          </div>
        `;
      });
    }

    /* KEYPAD MODAL LOGIC */
    function openKeypad() {
      currentInputValue = "";
      selectedStudentId = null;
      updateDisplay();
      renderStudentSelector();
      document.getElementById('keypad-modal').classList.add('active');
    }

    function closeKeypad() {
      document.getElementById('keypad-modal').classList.remove('active');
    }

    function renderStudentSelector() {
      const container = document.getElementById('student-selector');
      container.innerHTML = '';

      studentsData.forEach(s => {
        const isDone = answeredThisRound[s.id];
        const btn = document.createElement('button');
        btn.className = `btn-student-choice ${isDone ? 'disabled' : ''}`;
        btn.innerText = s.name;
        if (!isDone) {
          btn.onclick = () => selectStudent(s.id);
        } else {
          btn.disabled = true;
        }
        container.appendChild(btn);
      });
    }

    function selectStudent(id) {
      playBeep(400, 'sine', 0.05);
      selectedStudentId = id;
      document.querySelectorAll('.btn-student-choice').forEach((btn, idx) => {
        if (studentsData[idx].id === id) {
          btn.classList.add('selected');
        } else {
          btn.classList.remove('selected');
        }
      });
    }

    function pressNum(num) {
      playBeep(350, 'sine', 0.05);
      if (currentInputValue.length < 7) {
        currentInputValue += num;
        updateDisplay();
      }
    }

    function pressDel() {
      playBeep(280, 'sine', 0.05);
      currentInputValue = currentInputValue.slice(0, -1);
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById('input-display').innerText = currentInputValue || "_";
    }

    function submitAnswer() {
      if (!selectedStudentId) {
        alert("Pilih nama anak yang menjawab terlebih dahulu!");
        return;
      }
      if (!currentInputValue) return;

      const userAns = parseInt(currentInputValue, 10);
      const correctAns = questionsBank[currentRound][selectedStudentId].a;

      closeKeypad();

      if (userAns === correctAns) {
        scores[selectedStudentId] += 100;
        playSoundCorrect();
        showToast(`BENAR! ${studentsData.find(s=>s.id===selectedStudentId).name} +100`, true);
      } else {
        playSoundWrong();
        showToast(`SALAH! Jawaban: ${correctAns}`, false);
      }

      answeredThisRound[selectedStudentId] = true;
      renderMiniScoreboard();
      renderQuestions();

      // Cek apakah semua anak sudah menjawab di ronde ini
      const allDone = Object.values(answeredThisRound).every(v => v === true);
      if (allDone) {
        document.getElementById('btn-input-ans').style.display = 'none';
        document.getElementById('btn-next-rnd').style.display = 'block';
        if (currentRound === 4) {
          document.getElementById('btn-next-rnd').innerText = "LIHAT HASIL AKHIR";
        }
      }
    }

    function showToast(text, isCorrect) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.className = `feedback-toast ${isCorrect ? 'correct' : 'wrong'} show`;
      setTimeout(() => {
        toast.classList.remove('show');
      }, 1800);
    }

    function nextRound() {
      if (currentRound < 4) {
        currentRound++;
        initRound();
      } else {
        showLeaderboard();
      }
    }

    /* LEADERBOARD & CELEBRATION */
    function showLeaderboard() {
      showScreen('screen-leaderboard');

      // Sort ranking
      const sorted = [...studentsData].sort((a, b) => scores[b.id] - scores[a.id]);
      const podium = document.getElementById('podium-list');
      podium.innerHTML = '';

      sorted.forEach((s, idx) => {
        podium.innerHTML += `
          <div class="podium-card rank-${idx + 1}">
            <div class="rank-num">#${idx + 1}</div>
            <div class="player-info">
              <div class="player-name">${s.name}</div>
              <div class="player-class">${s.class}</div>
            </div>
            <div class="player-score">${scores[s.id]} PTS</div>
          </div>
        `;
      });

      // Launch Confetti
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    function resetGame() {
      showScreen('screen-home');
    }
  </script>
</body>
</html>
